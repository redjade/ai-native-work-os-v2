<svg xmlns="http://www.w3.org/2000/svg" width="720" height="324" viewBox="0 0 720 324" role="img"><title>LLM Wiki에서 지식이 흐르는 방향</title><desc>원자료를 읽어 출처 노트를 만들고, 여러 출처를 비교해 개념 노트를 만들고, 그것으로 결과물을 만든다. 확인하지 못한 것은 질문 폴더로 따로 남긴다.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.t{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#4b5563}.th{font-size:14px;font-weight:500;fill:#111827}.bx{fill:#ffffff;stroke:#9ca3af;stroke-width:.8}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:.8}.amber{fill:#fffbeb;stroke:#f59e0b;stroke-width:.8}.ln{stroke:#6b7280;stroke-width:1.2;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="720" height="324" fill="#ffffff"/><rect class="bx" x="30" y="60" width="150" height="64" rx="4"/><text class="th" x="105" y="88" text-anchor="middle">원자료</text><text class="ts" x="105" y="108" text-anchor="middle">논문·기사·영상</text><rect class="blue" x="200" y="60" width="150" height="64" rx="4"/><text class="th" x="275" y="88" text-anchor="middle">sources/</text><text class="ts" x="275" y="108" text-anchor="middle">출처와 핵심 주장</text><rect class="blue" x="370" y="60" width="150" height="64" rx="4"/><text class="th" x="445" y="88" text-anchor="middle">concepts/</text><text class="ts" x="445" y="108" text-anchor="middle">여러 출처를 비교</text><rect class="blue" x="540" y="60" width="150" height="64" rx="4"/><text class="th" x="615" y="88" text-anchor="middle">outputs/</text><text class="ts" x="615" y="108" text-anchor="middle">보여 줄 결과물</text><line class="ln" x1="180" y1="92" x2="200" y2="92" marker-end="url(#a)"/><line class="ln" x1="350" y1="92" x2="370" y2="92" marker-end="url(#a)"/><line class="ln" x1="520" y1="92" x2="540" y2="92" marker-end="url(#a)"/><rect class="blue" x="245" y="180" width="230" height="56" rx="4"/><text class="th" x="360" y="204" text-anchor="middle">questions/</text><text class="ts" x="360" y="224" text-anchor="middle">아직 확인 못한 것</text><path class="ln" d="M275 124 L275 158 L310 180" marker-end="url(#a)"/><path class="ln" d="M445 124 L445 158 L410 180" marker-end="url(#a)"/><rect class="amber" x="30" y="260" width="660" height="44" rx="4"/><text class="th" x="48" y="282">AI 요약을 모아 두는 곳이 아니다</text><text class="ts" x="48" y="298">확인한 것만 남기고, 확인 못한 것은 질문으로 옮긴다</text></svg>
