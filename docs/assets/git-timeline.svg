<svg xmlns="http://www.w3.org/2000/svg" width="720" height="195" viewBox="0 0 720 195" role="img"><title>커밋은 되돌아갈 수 있는 저장 지점</title><desc>시간축 위에 커밋 세 개와 현재 작업 중인 지점이 있고, 현재 지점에서 이전 커밋으로 되돌아갈 수 있다.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.t{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#4b5563}.th{font-size:14px;font-weight:500;fill:#111827}.bx{fill:#ffffff;stroke:#9ca3af;stroke-width:.8}.amber{fill:#fffbeb;stroke:#f59e0b;stroke-width:.8}.dot{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.4}.now{fill:#ffffff;stroke:#9ca3af;stroke-width:1.4;stroke-dasharray:3 2}.ln{stroke:#6b7280;stroke-width:1.2;fill:none}.axis{stroke:#9ca3af;stroke-width:1.2;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="720" height="195" fill="#ffffff"/><rect class="amber" x="370" y="20" width="210" height="30" rx="4"/><text class="th" x="475" y="40" text-anchor="middle">여기로 되돌릴 수 있다</text><path class="ln" d="M620 106 C620 62, 320 62, 320 106" marker-end="url(#a)"/><line class="axis" x1="60" y1="120" x2="668" y2="120" marker-end="url(#a)"/><text class="ts" x="676" y="124">시간</text><circle class="dot" cx="140" cy="120" r="7"/><circle class="dot" cx="320" cy="120" r="7"/><circle class="dot" cx="500" cy="120" r="7"/><circle class="now" cx="620" cy="120" r="7"/><text class="th" x="140" y="148" text-anchor="middle">커밋 1</text><text class="ts" x="140" y="166" text-anchor="middle">첫 노트</text><text class="th" x="320" y="148" text-anchor="middle">커밋 2</text><text class="ts" x="320" y="166" text-anchor="middle">출처 추가</text><text class="th" x="500" y="148" text-anchor="middle">커밋 3</text><text class="ts" x="500" y="166" text-anchor="middle">표 완성</text><text class="th" x="620" y="148" text-anchor="middle">지금</text><text class="ts" x="620" y="166" text-anchor="middle">작업 중</text></svg>
