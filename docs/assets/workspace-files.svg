<svg xmlns="http://www.w3.org/2000/svg" width="720" height="448" viewBox="0 0 720 448" role="img"><title>작업공간 파일마다 맡는 질문</title><desc>HOME은 지금 상태와 다음 행동, PROJECT는 목표와 완료 조건, TASKS는 이번 작업, DECISIONS는 그렇게 정한 이유, LOG는 한 일, README는 남에게 하는 설명, AGENTS는 에이전트가 지킬 규칙을 맡는다. 한 파일이 한 질문만 맡는다.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.t{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#4b5563}.th{font-size:14px;font-weight:500;fill:#111827}.bx{fill:#ffffff;stroke:#9ca3af;stroke-width:.8}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:.8}.amber{fill:#fffbeb;stroke:#f59e0b;stroke-width:.8}.hd{fill:#f9fafb;stroke:#9ca3af;stroke-width:.8}</style><rect width="720" height="448" fill="#ffffff"/><rect class="hd" x="40" y="34" width="200" height="32" rx="4"/><text class="th" x="56" y="55">파일</text><rect class="hd" x="250" y="34" width="430" height="32" rx="4"/><text class="th" x="266" y="55">이 파일만 답하는 질문</text><rect class="blue" x="40" y="80" width="200" height="36" rx="4"/><text class="th" x="56" y="103">HOME.md</text><rect class="bx" x="250" y="80" width="430" height="36" rx="4"/><text class="ts" x="266" y="103">지금 상태와 다음 행동은?</text><rect class="blue" x="40" y="122" width="200" height="36" rx="4"/><text class="th" x="56" y="145">PROJECT.md</text><rect class="bx" x="250" y="122" width="430" height="36" rx="4"/><text class="ts" x="266" y="145">무엇을 왜 만드나? 언제 끝난 것인가?</text><rect class="blue" x="40" y="164" width="200" height="36" rx="4"/><text class="th" x="56" y="187">TASKS.md</text><rect class="bx" x="250" y="164" width="430" height="36" rx="4"/><text class="ts" x="266" y="187">이번에 할 작업은?</text><rect class="blue" x="40" y="206" width="200" height="36" rx="4"/><text class="th" x="56" y="229">DECISIONS.md</text><rect class="bx" x="250" y="206" width="430" height="36" rx="4"/><text class="ts" x="266" y="229">왜 그렇게 정했나?</text><rect class="blue" x="40" y="248" width="200" height="36" rx="4"/><text class="th" x="56" y="271">LOG.md</text><rect class="bx" x="250" y="248" width="430" height="36" rx="4"/><text class="ts" x="266" y="271">무엇을 했나?</text><rect class="blue" x="40" y="290" width="200" height="36" rx="4"/><text class="th" x="56" y="313">README.md</text><rect class="bx" x="250" y="290" width="430" height="36" rx="4"/><text class="ts" x="266" y="313">처음 보는 사람에게 어떻게 설명하나?</text><rect class="blue" x="40" y="332" width="200" height="36" rx="4"/><text class="th" x="56" y="355">AGENTS.md</text><rect class="bx" x="250" y="332" width="430" height="36" rx="4"/><text class="ts" x="266" y="355">에이전트가 늘 지킬 규칙은?</text><rect class="amber" x="40" y="384" width="640" height="44" rx="4"/><text class="th" x="58" y="406">한 파일이 한 질문만 맡는다</text><text class="ts" x="58" y="422">역할이 겹치면 어디에 써야 할지 매번 고민하게 된다</text></svg>
