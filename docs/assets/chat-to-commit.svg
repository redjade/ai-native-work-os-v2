<svg xmlns="http://www.w3.org/2000/svg" width="720" height="231" viewBox="0 0 720 231" role="img"><title>챗에서 GitHub까지</title><desc>챗은 편하지만 닫으면 사라지고, 검증한 내용을 파일로 옮겨 커밋하면 GitHub에서 눈에 보이며 남는다.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.t{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#4b5563}.th{font-size:14px;font-weight:500;fill:#111827}.bx{fill:#ffffff;stroke:#9ca3af;stroke-width:.8}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:.8}.gray{fill:#f3f4f6;stroke:#9ca3af;stroke-width:.8}.amber{fill:#fffbeb;stroke:#f59e0b;stroke-width:.8}.ln{stroke:#6b7280;stroke-width:1.2;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="720" height="231" fill="#ffffff"/><rect class="gray" x="30" y="70" width="150" height="72" rx="4"/><text class="th" x="105" y="98" text-anchor="middle">챗</text><text class="ts" x="105" y="120" text-anchor="middle">편하고 빠르다</text><rect class="blue" x="200" y="70" width="150" height="72" rx="4"/><text class="th" x="275" y="98" text-anchor="middle">파일</text><text class="ts" x="275" y="120" text-anchor="middle">검증한 것만</text><rect class="blue" x="370" y="70" width="150" height="72" rx="4"/><text class="th" x="445" y="98" text-anchor="middle">커밋</text><text class="ts" x="445" y="120" text-anchor="middle">되돌릴 수 있다</text><rect class="blue" x="540" y="70" width="150" height="72" rx="4"/><text class="th" x="615" y="98" text-anchor="middle">GitHub</text><text class="ts" x="615" y="120" text-anchor="middle">보이고 남는다</text><line class="ln" x1="180" y1="106" x2="200" y2="106" marker-end="url(#a)"/><line class="ln" x1="350" y1="106" x2="370" y2="106" marker-end="url(#a)"/><line class="ln" x1="520" y1="106" x2="540" y2="106" marker-end="url(#a)"/><rect class="gray" x="30" y="165" width="150" height="36" rx="4"/><text class="ts" x="105" y="188" text-anchor="middle">닫으면 사라진다</text><rect class="amber" x="200" y="165" width="490" height="36" rx="4"/><text class="th" x="445" y="188" text-anchor="middle">여기부터 안전하게 남는다</text></svg>
