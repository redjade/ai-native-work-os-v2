<svg xmlns="http://www.w3.org/2000/svg" width="720" height="378" viewBox="0 0 720 378" role="img"><title>에이전트의 컨텍스트 구조</title><desc>왼쪽은 이번 대화에서 에이전트가 보는 것 세 가지로 프로젝트 규칙 파일, 열어 준 파일, 이번 대화이며, 오른쪽은 보이지 않는 것 세 가지로 다른 폴더, 지난 대화, 말하지 않은 전제다. 새 대화를 열면 왼쪽이 다시 비워진다.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.t{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#4b5563}.th{font-size:14px;font-weight:500;fill:#111827}.bx{fill:#ffffff;stroke:#9ca3af;stroke-width:.8}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:.8}.gray{fill:#f3f4f6;stroke:#9ca3af;stroke-width:.8}.amber{fill:#fffbeb;stroke:#f59e0b;stroke-width:.8}</style><rect width="720" height="378" fill="#ffffff"/><rect class="bx" x="40" y="60" width="300" height="230" rx="8"/><text class="th" x="60" y="86">이번 대화에서 보이는 것</text><rect class="blue" x="60" y="100" width="260" height="52" rx="4"/><text class="th" x="76" y="119">AGENTS.md</text><text class="ts" x="76" y="137">프로젝트 규칙</text><rect class="blue" x="60" y="162" width="260" height="52" rx="4"/><text class="th" x="76" y="181">열어 준 파일</text><text class="ts" x="76" y="199">지금 경로에 있는 것</text><rect class="blue" x="60" y="224" width="260" height="52" rx="4"/><text class="th" x="76" y="243">이번 대화</text><text class="ts" x="76" y="261">방금 주고받은 말</text><rect class="bx" x="380" y="60" width="300" height="230" rx="8"/><text class="th" x="400" y="86">보이지 않는 것</text><rect class="gray" x="400" y="100" width="260" height="52" rx="4"/><text class="th" x="416" y="119">다른 폴더</text><text class="ts" x="416" y="137">경로 밖의 파일</text><rect class="gray" x="400" y="162" width="260" height="52" rx="4"/><text class="th" x="416" y="181">지난 대화</text><text class="ts" x="416" y="199">닫으면 사라짐</text><rect class="gray" x="400" y="224" width="260" height="52" rx="4"/><text class="th" x="416" y="243">내 머릿속</text><text class="ts" x="416" y="261">말하지 않은 전제</text><rect class="amber" x="40" y="310" width="640" height="48" rx="4"/><text class="th" x="60" y="331">새 대화를 열면 왼쪽은 다시 비워진다</text><text class="ts" x="60" y="349">그래서 규칙과 결과를 파일로 남긴다</text></svg>
