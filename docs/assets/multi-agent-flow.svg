<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" role="img"><title>멀티에이전트 순차 검토와 사람의 결정 지점</title><desc>사람이 검토 범위를 승인한 뒤 계획 검토자, 검증 담당자, 보안 검토자가 읽기 전용으로 순서대로 검토하고, 사람이 종합해 결정한 다음 주 도구가 승인된 것만 수정하고 사람이 점검 후 커밋한다.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.t{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#4b5563}.th{font-size:14px;font-weight:500;fill:#111827}.bx{fill:#ffffff;stroke:#9ca3af;stroke-width:.8}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:.8}.gray{fill:#f3f4f6;stroke:#9ca3af;stroke-width:.8}.amber{fill:#fffbeb;stroke:#f59e0b;stroke-width:.8}.ln{stroke:#6b7280;stroke-width:1.2;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="720" height="438" fill="#ffffff"/><rect class="amber" x="40" y="50" width="640" height="44" rx="4"/><text class="th" x="58" y="72">사람 · 검토 범위 승인</text><text class="ts" x="58" y="88">어떤 파일을 어떤 기준으로 볼지 정한다</text><line class="ln" x1="360" y1="94" x2="360" y2="112" marker-end="url(#a)"/><rect class="bx" x="30" y="112" width="660" height="108" rx="8"/><text class="th" x="45" y="134">읽기 전용 · 순서대로 한 명씩</text><rect class="blue" x="45" y="146" width="200" height="60" rx="4"/><text class="th" x="61" y="170">계획 검토자</text><text class="ts" x="61" y="190">완료 조건</text><rect class="blue" x="260" y="146" width="200" height="60" rx="4"/><text class="th" x="276" y="170">검증 담당자</text><text class="ts" x="276" y="190">근거와 사실</text><rect class="blue" x="475" y="146" width="200" height="60" rx="4"/><text class="th" x="491" y="170">보안 검토자</text><text class="ts" x="491" y="190">공개 위험</text><line class="ln" x1="245" y1="176" x2="260" y2="176" marker-end="url(#a)"/><line class="ln" x1="460" y1="176" x2="475" y2="176" marker-end="url(#a)"/><line class="ln" x1="360" y1="220" x2="360" y2="240" marker-end="url(#a)"/><rect class="amber" x="40" y="240" width="640" height="44" rx="4"/><text class="th" x="58" y="262">사람 · 세 보고를 종합해 결정</text><text class="ts" x="58" y="278">받아들일 것과 넘길 것을 이유와 함께 적는다</text><line class="ln" x1="360" y1="284" x2="360" y2="302" marker-end="url(#a)"/><rect class="gray" x="40" y="302" width="640" height="44" rx="4"/><text class="th" x="58" y="324">주 도구 · 승인한 것만 수정</text><text class="ts" x="58" y="340">쓰기 권한은 여기 하나뿐이다</text><line class="ln" x1="360" y1="346" x2="360" y2="364" marker-end="url(#a)"/><rect class="amber" x="40" y="364" width="640" height="44" rx="4"/><text class="th" x="58" y="386">사람 · 점검 후 커밋</text><text class="ts" x="58" y="402">공개 전 보안 점검을 통과했는지 확인한다</text></svg>
