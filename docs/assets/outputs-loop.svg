<svg xmlns="http://www.w3.org/2000/svg" width="720" height="205" viewBox="0 0 720 205" role="img"><title>산출물 루프 여섯 단계</title><desc>정의, 위임, 검증, 기록, 공유, 개선 여섯 단계가 순서대로 이어지고 마지막에서 처음으로 돌아가 매주 반복된다.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.t{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#4b5563}.th{font-size:14px;font-weight:500;fill:#111827}.bx{fill:#ffffff;stroke:#9ca3af;stroke-width:.8}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:.8}.ln{stroke:#6b7280;stroke-width:1.2;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="720" height="205" fill="#ffffff"/><rect class="blue" x="30" y="60" width="100" height="64" rx="4"/><text class="th" x="80" y="86" text-anchor="middle">정의</text><text class="ts" x="80" y="106" text-anchor="middle">문제와 조건</text><rect class="blue" x="142" y="60" width="100" height="64" rx="4"/><text class="th" x="192" y="86" text-anchor="middle">위임</text><text class="ts" x="192" y="106" text-anchor="middle">목표와 제약</text><rect class="blue" x="254" y="60" width="100" height="64" rx="4"/><text class="th" x="304" y="86" text-anchor="middle">검증</text><text class="ts" x="304" y="106" text-anchor="middle">외부 근거</text><rect class="blue" x="366" y="60" width="100" height="64" rx="4"/><text class="th" x="416" y="86" text-anchor="middle">기록</text><text class="ts" x="416" y="106" text-anchor="middle">커밋과 판단</text><rect class="blue" x="478" y="60" width="100" height="64" rx="4"/><text class="th" x="528" y="86" text-anchor="middle">공유</text><text class="ts" x="528" y="106" text-anchor="middle">README</text><rect class="blue" x="590" y="60" width="100" height="64" rx="4"/><text class="th" x="640" y="86" text-anchor="middle">개선</text><text class="ts" x="640" y="106" text-anchor="middle">다음 한 가지</text><line class="ln" x1="130" y1="92" x2="142" y2="92" marker-end="url(#a)"/><line class="ln" x1="242" y1="92" x2="254" y2="92" marker-end="url(#a)"/><line class="ln" x1="354" y1="92" x2="366" y2="92" marker-end="url(#a)"/><line class="ln" x1="466" y1="92" x2="478" y2="92" marker-end="url(#a)"/><line class="ln" x1="578" y1="92" x2="590" y2="92" marker-end="url(#a)"/><path class="ln" d="M640 124 L640 164 L80 164 L80 124" marker-end="url(#a)"/><rect class="bx" x="300" y="150" width="120" height="28" rx="4"/><text class="ts" x="360" y="168" text-anchor="middle">매주 반복</text></svg>
