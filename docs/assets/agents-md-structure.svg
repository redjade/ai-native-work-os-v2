<svg xmlns="http://www.w3.org/2000/svg" width="720" height="436" viewBox="0 0 720 436" role="img"><title>AGENTS.md의 구조</title><desc>AGENTS.md는 프로젝트 목적, 폴더 규칙, 검증 규칙, 하지 않을 것 네 부분으로 이루어진다. 좋은 규칙은 바로 따를 수 있게 구체적이고, 좋지 않은 규칙은 무엇을 할지 알 수 없다.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.t{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#4b5563}.th{font-size:14px;font-weight:500;fill:#111827}.bx{fill:#ffffff;stroke:#9ca3af;stroke-width:.8}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:.8}.gray{fill:#f3f4f6;stroke:#9ca3af;stroke-width:.8}.amber{fill:#fffbeb;stroke:#f59e0b;stroke-width:.8}</style><rect width="720" height="436" fill="#ffffff"/><rect class="bx" x="50" y="70" width="300" height="270" rx="8"/><text class="th" x="66" y="96">AGENTS.md</text><rect class="gray" x="66" y="112" width="268" height="50" rx="4"/><text class="th" x="80" y="132">프로젝트 목적</text><text class="ts" x="80" y="150">무엇을 만드나</text><rect class="gray" x="66" y="168" width="268" height="50" rx="4"/><text class="th" x="80" y="188">폴더 규칙</text><text class="ts" x="80" y="206">어디를 고쳐도 되나</text><rect class="gray" x="66" y="224" width="268" height="50" rx="4"/><text class="th" x="80" y="244">검증 규칙</text><text class="ts" x="80" y="262">무엇으로 확인하나</text><rect class="gray" x="66" y="280" width="268" height="50" rx="4"/><text class="th" x="80" y="300">하지 않을 것</text><text class="ts" x="80" y="318">금지와 승인</text><rect class="blue" x="380" y="112" width="290" height="100" rx="4"/><text class="th" x="398" y="138">좋은 규칙</text><text class="ts" x="398" y="162">노트는 knowledge/sources/에</text><text class="ts" x="398" y="184">처음 와도 바로 따를 수 있다</text><rect class="amber" x="380" y="232" width="290" height="100" rx="4"/><text class="th" x="398" y="258">좋지 않은 규칙</text><text class="ts" x="398" y="282">항상 최고 품질로 작성한다</text><text class="ts" x="398" y="304">무엇을 할지 알 수 없다</text><rect class="amber" x="50" y="360" width="620" height="46" rx="4"/><text class="th" x="68" y="383">에이전트는 매번 처음 도착한다</text><text class="ts" x="68" y="401">그래서 처음 온 사람에게 설명하듯 적는다</text></svg>
