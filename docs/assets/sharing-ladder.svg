<svg xmlns="http://www.w3.org/2000/svg" width="720" height="229" viewBox="0 0 720 229" role="img"><title>공개 범위는 좁게 시작해 한 단계씩 넓힌다</title><desc>개인, 수업, 제한 공유, 공개 네 단계가 있고 제한 공유와 공개 사이에 되돌릴 수 없는 경계가 있다. 비공개로 시작하며 공개는 필수가 아니다.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.t{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#4b5563}.th{font-size:14px;font-weight:500;fill:#111827}.bx{fill:#ffffff;stroke:#9ca3af;stroke-width:.8}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:.8}.amber{fill:#fffbeb;stroke:#f59e0b;stroke-width:.8}.ln{stroke:#6b7280;stroke-width:1.2;fill:none}.gate{stroke:#f59e0b;stroke-width:1.6;stroke-dasharray:5 3;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="720" height="229" fill="#ffffff"/><rect class="amber" x="380" y="18" width="300" height="32" rx="4"/><text class="th" x="530" y="39" text-anchor="middle">이 선을 넘으면 되돌릴 수 없다</text><rect class="blue" x="30" y="70" width="150" height="64" rx="4"/><text class="th" x="105" y="98" text-anchor="middle">개인</text><text class="ts" x="105" y="118" text-anchor="middle">나만 본다</text><rect class="blue" x="200" y="70" width="150" height="64" rx="4"/><text class="th" x="275" y="98" text-anchor="middle">수업</text><text class="ts" x="275" y="118" text-anchor="middle">참가자와 강사</text><rect class="blue" x="370" y="70" width="150" height="64" rx="4"/><text class="th" x="445" y="98" text-anchor="middle">제한 공유</text><text class="ts" x="445" y="118" text-anchor="middle">지정한 몇 사람</text><rect class="amber" x="540" y="70" width="150" height="64" rx="4"/><text class="th" x="615" y="98" text-anchor="middle">공개</text><text class="ts" x="615" y="118" text-anchor="middle">누구나 본다</text><line class="ln" x1="180" y1="102" x2="200" y2="102" marker-end="url(#a)"/><line class="ln" x1="350" y1="102" x2="370" y2="102" marker-end="url(#a)"/><line class="gate" x1="530" y1="56" x2="530" y2="148"/><rect class="amber" x="30" y="165" width="660" height="44" rx="4"/><text class="th" x="48" y="187">비공개로 시작해 필요한 것만 넓힌다</text><text class="ts" x="48" y="203">공개는 이 과정의 필수 조건이 아니다</text></svg>
