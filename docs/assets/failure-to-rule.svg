<svg xmlns="http://www.w3.org/2000/svg" width="720" height="259" viewBox="0 0 720 259" role="img"><title>실패를 규칙으로 바꾸는 반복</title><desc>실행하고 실패 유형을 관찰한 뒤 규칙 한 줄을 추가하고, 새 대화에서 다시 실행해 같은 기준으로 비교한다. 효과가 없으면 그 규칙을 지운다.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.t{font-size:14px;fill:#1f2937}.ts{font-size:12px;fill:#4b5563}.th{font-size:14px;font-weight:500;fill:#111827}.bx{fill:#ffffff;stroke:#9ca3af;stroke-width:.8}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:.8}.amber{fill:#fffbeb;stroke:#f59e0b;stroke-width:.8}.ln{stroke:#6b7280;stroke-width:1.2;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="720" height="259" fill="#ffffff"/><rect class="blue" x="30" y="60" width="150" height="64" rx="4"/><text class="th" x="105" y="88" text-anchor="middle">실행</text><text class="ts" x="105" y="108" text-anchor="middle">결과를 본다</text><rect class="blue" x="200" y="60" width="150" height="64" rx="4"/><text class="th" x="275" y="88" text-anchor="middle">실패 관찰</text><text class="ts" x="275" y="108" text-anchor="middle">어떤 유형인가</text><rect class="amber" x="370" y="60" width="150" height="64" rx="4"/><text class="th" x="445" y="88" text-anchor="middle">규칙 한 줄</text><text class="ts" x="445" y="108" text-anchor="middle">내가 판단해 적는다</text><rect class="blue" x="540" y="60" width="150" height="64" rx="4"/><text class="th" x="615" y="88" text-anchor="middle">재실행·비교</text><text class="ts" x="615" y="108" text-anchor="middle">같은 기준으로</text><line class="ln" x1="180" y1="92" x2="200" y2="92" marker-end="url(#a)"/><line class="ln" x1="350" y1="92" x2="370" y2="92" marker-end="url(#a)"/><line class="ln" x1="520" y1="92" x2="540" y2="92" marker-end="url(#a)"/><path class="ln" d="M615 124 L615 168 L105 168 L105 124" marker-end="url(#a)"/><rect class="bx" x="270" y="154" width="180" height="28" rx="4"/><text class="ts" x="360" y="172" text-anchor="middle">효과 없으면 지운다</text><rect class="amber" x="30" y="195" width="660" height="44" rx="4"/><text class="th" x="48" y="217">한 번에 규칙 하나만 바꾼다</text><text class="ts" x="48" y="233">그래야 그 규칙이 효과가 있었는지 알 수 있다</text></svg>
